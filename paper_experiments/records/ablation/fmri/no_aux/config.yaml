model:
  target: Models.KPD.k_diffusion.Model
  params:
    seq_length: 24
    feature_size: 50
    n_layer_enc: 4
    n_layer_dec: 4
    d_model: 96
    timesteps: 1000
    sampling_timesteps: 1000
    loss_type: l1
    beta_schedule: cosine
    n_heads: 4
    mlp_hidden_times: 4
    attn_pd: 0.0
    resid_pd: 0.0
    kernel_size: 5
    padding_size: 2
    fdm_mode: real
    prototype_mode: multiscale
    prototype_scales:
    - 4
    - 8
    - 16
    num_prototypes: 8
    prototype_loss_weight: 0.0
    sampling_mode: adaptive_reflection
    adaptive_sampling_timesteps: 50
    reflection_strength: 0.1
    reflection_threshold: 0.15
    reflection_topk_ratio: 0.25
    reflection_roughness_threshold: 1.25
solver:
  base_lr: 1.0e-05
  max_epochs: 15000
  results_folder: ./checkpoints/journal/Checkpoints_journal_fmri
  gradient_accumulate_every: 2
  save_cycle: 1500
  ema:
    decay: 0.995
    update_interval: 10
  scheduler:
    target: Layer.engine.lr_sch.ReduceLROnPlateauWithWarmup
    params:
      factor: 0.5
      patience: 3000
      min_lr: 1.0e-05
      threshold: 0.1
      threshold_mode: rel
      warmup_lr: 0.0008
      warmup: 500
      verbose: false
dataloader:
  train_dataset:
    target: Utils.Data_utils.real_datasets.fMRIDataset
    params:
      name: fMRI
      proportion: 1.0
      data_root: ./Data/datasets/fMRI
      window: 24
      save2npy: true
      neg_one_to_one: true
      seed: 123
      period: train
  batch_size: 64
  sample_size: 256
  shuffle: true
